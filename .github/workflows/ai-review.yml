name: AI review (Claude)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Same-repo PRs only: fork PRs get no secrets, and the job would fail noisily.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # Secrets cannot be read in `if:` directly. Without the token the review is skipped, not
      # failed, so a clone without the secret still has green CI.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN not set; AI review skipped."

      - uses: actions/checkout@v6
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in a repository whose rules are in AGENTS.md.
            Read AGENTS.md first, then the PR diff (`gh pr diff`) and the changed files in full.

            Review for, in priority order:
            1. Fail-open paths: any way to reach ALLOW on an exception, unknown tool, missing or
               invalid policy, or malformed input (AGENTS.md §2.1).
            2. Data exposure: argument values, message content or PII in logs, exception messages
               or error responses (§2.2); non-synthetic identifiers in fixtures (§2.3).
            3. Test integrity: tests weakened, skipped, xfailed or deleted; implementation that
               special-cases test inputs; missing tests for new behaviour or failure paths (§5).
            4. Correctness bugs and edge cases (boundaries, empty inputs, formatting variants).
            5. Conventions: §6 code conventions and §7 comment rules (flag redundant comments).

            Severity: P0 fail-open/security/data exposure, P1 incorrect behaviour,
            P2 maintainability or missing test, P3 nit. Prefix every comment with [P0]..[P3].
            Post inline comments on specific lines and one summary comment listing all findings,
            or stating "No findings" explicitly. Do not approve, request changes, or push commits.
            Do not comment on formatting that ruff enforces.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
