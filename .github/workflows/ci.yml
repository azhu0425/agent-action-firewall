name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The job name "verify" is the required status check in the main-branch ruleset.
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --all-extras --locked
      - name: Verify
        run: uv run --locked python scripts/verify.py
