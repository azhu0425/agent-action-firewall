version: 2
updates:
  # open-pull-requests-limit 0 turns off routine version bumps but keeps security updates,
  # so the commit history during the build window holds only intentional work.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
