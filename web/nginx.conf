server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, re-resolved at request time: nginx starts even when the firewall
    # container is down or unhealthy (so the console can show fail-closed mode), and follows
    # the firewall container if it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $firewall http://firewall:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $firewall;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
}
