# Gates that apply to every contributor, human or agent. CI runs the same checks via verify.py.
# Pin refresh: `pre-commit autoupdate` (Phase 0).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^eval/corpus/        # human-owned and hash-pinned: never rewrite
      - id: end-of-file-fixer
        exclude: ^eval/corpus/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
